<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Info App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
      background-color: #f4f4f4;
    }
    input {
      padding: 10px;
      width: 60%;
      font-size: 16px;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #result {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      min-height: 100px;
    }
    img {
      width: 150px;
      margin: 15px 0;
      border: 1px solid #ddd;
    }
    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Country Info App</h1>

  <input type="text" id="countryInput" placeholder="Enter country name...">
  <br>
  <button id="searchBtn">Search</button>

  <div id="result"></div>

  <script src="script.js"></script>
</body>
</html>
